<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .countdown-container {
            text-align: center;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 20px;
            color: #00adb5;
        }

        .timer {
            display: flex;
            gap: 20px;
            font-size: 2.5rem;
            font-weight: bold;
            justify-content: center;
        }

        .time-box {
            background: #1e1e1e;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            min-width: 80px;
        }

        .label {
            display: block;
            font-size: 0.9rem;
            color: #888;
            text-transform: uppercase;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="countdown-container">
        <h1>x1x1</h1>
        
        <div class="timer">
            <div class="time-box">
                <span id="days">00</span>
                <span class="label">Days</span>
            </div>
            <div class="time-box">
                <span id="hours">00</span>
                <span class="label">Hours</span>
            </div>
            <div class="time-box">
                <span id="minutes">00</span>
                <span class="label">Mins</span>
            </div>
            <div class="time-box">
                <span id="seconds">00</span>
                <span class="label">Secs</span>
            </div>
        </div>
    </div>
